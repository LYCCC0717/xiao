<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f2ed">
  <title>我们 · A LIVING ARCHIVE OF TWO</title>
  <meta name="description" content="我们的故事、时间、纪念日与去过的地方。一页一页地翻。">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/music.css">
</head>
<body>
  <div class="veil" aria-hidden="true"></div>

  <!-- ── 顶部 / 常驻的玻璃工具条 ───────────────────────────── -->
  <header class="hud">
    <a class="hud__brand glass glass--pill" href="#p-cover" data-jump="0">
      <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="19.2" fill="none" stroke="currentColor" stroke-opacity=".5"/>
        <path d="M20 9 L22.4 17.6 L31 20 L22.4 22.4 L20 31 L17.6 22.4 L9 20 L17.6 17.6 Z"/>
      </svg>
      <span class="hud__name" id="brandName">我们</span>
      <span class="hud__sub" id="brandSub">A LIVING ARCHIVE OF TWO</span>
    </a>

    <div class="hud__tools">
      <button class="hud__day glass glass--pill" id="dayBtn" type="button">
        <b id="daysMini">0000</b>
        <span>DAYS</span>
      </button>
      <div class="hud__pager glass glass--pill" aria-hidden="true">
        <b id="pagerNow">01</b>
        <i class="hud__track"><b id="pagerFill"></b></i>
        <span id="pagerAll">06</span>
      </div>
    </div>
  </header>

  <!-- ── 右侧章节导航 ─────────────────────────────────────── -->
  <nav class="rail" id="rail" aria-label="章节导航"></nav>

  <!-- ── 翻页容器 ─────────────────────────────────────────── -->
  <main class="deck" id="deck">

    <!-- 00 · 序 -->
    <section class="page page--cover" id="p-cover" data-label="序" aria-labelledby="coverTitle">
      <span class="ghost" data-par="-.14" aria-hidden="true">00</span>
      <div class="page__inner">
        <p class="eyebrow"><span class="eyebrow__n">00</span><span>PROLOGUE</span></p>

        <h1 class="cover__title" id="coverTitle">我们</h1>
        <p class="cover__sub" id="coverSub">A LIVING ARCHIVE OF TWO</p>

        <div class="cover__day glass glass--wide">
          <div class="cover__day-num"><b id="daysNum">0000</b><span>天</span></div>
          <div class="cover__day-meta">
            <p>DAYS TOGETHER</p>
            <p class="dim" id="sinceLine">自 —</p>
          </div>
        </div>

      </div>
    </section>

    <!-- 01 · 去过的地方 -->
    <section class="page" id="p-places" data-label="地点" aria-labelledby="placesTitle">
      <span class="ghost" data-par="-.1" aria-hidden="true">01</span>
      <div class="page__inner">
        <header class="head">
          <p class="eyebrow"><span class="eyebrow__n">01</span><span>PLACES</span></p>
          <h2 class="head__title" id="placesTitle">去过的地方</h2>
        </header>
        <div class="geo">
          <div class="mapline" id="map" aria-hidden="true"></div>
          <div class="places" id="places"></div>
        </div>
      </div>
    </section>

    <!-- 02 · 合并的照片瀑布流，单独停用粒子 -->
    <section class="page page--memories" id="p-memories" data-label="日常" data-scrollable aria-labelledby="memoriesTitle">
      <span class="ghost" data-par="-.1" aria-hidden="true">02</span>
      <div class="page__inner">
        <header class="head">
          <p class="eyebrow"><span class="eyebrow__n">02</span><span>OUR LITTLE MOMENTS</span></p>
          <h2 class="head__title" id="memoriesTitle">和你一起的日常</h2>
          <p class="head__description">吃过的、玩过的，都是想再和你经历一次的日子。</p>
        </header>
        <div class="memory-filters" role="group" aria-label="筛选共同回忆">
          <button class="glass glass--pill" type="button" data-memory-filter="all" aria-pressed="true">全部</button>
          <button class="glass glass--pill" type="button" data-memory-filter="food" aria-pressed="false">一起吃饭</button>
          <button class="glass glass--pill" type="button" data-memory-filter="play" aria-pressed="false">一起玩</button>
          <span class="memory-count" id="memoryCount" aria-live="polite"></span>
        </div>
        <div class="memory-grid" id="memoryGrid" aria-label="共同回忆"></div>
      </div>
    </section>

    <!-- 04 · 时间长廊 -->
    <section class="page" id="p-time" data-label="时间" aria-labelledby="timeTitle">
      <span class="ghost" data-par="-.1" aria-hidden="true">04</span>
      <div class="page__inner">
        <header class="head">
          <p class="eyebrow"><span class="eyebrow__n">04</span><span>CORRIDOR</span></p>
          <h2 class="head__title" id="timeTitle">时间长廊</h2>
        </header>
        <ol class="time" id="time"></ol>
      </div>
    </section>

    <!-- 05 · 纪念日 -->
    <section class="page" id="p-dates" data-label="纪念日" aria-labelledby="datesTitle">
      <span class="ghost" data-par="-.1" aria-hidden="true">05</span>
      <div class="page__inner">
        <header class="head">
          <p class="eyebrow"><span class="eyebrow__n">05</span><span>ANNIVERSARY</span></p>
          <h2 class="head__title" id="datesTitle">纪念日</h2>
        </header>
        <div class="dates" id="dates"></div>
      </div>
    </section>

    <!-- 06 · 未完 -->
    <section class="page page--end" id="p-end" data-label="未完" aria-labelledby="endTitle">
      <span class="ghost" data-par="-.1" aria-hidden="true">06</span>
      <div class="page__inner">
        <p class="eyebrow"><span class="eyebrow__n">06</span><span>TO BE CONTINUED</span></p>
        <h2 class="end__title" id="endTitle">未完</h2>
        <div class="end__lines" id="endLines"></div>
        <button class="cta glass glass--tilt" id="endBtn" type="button">
          <span class="cta__no">∞</span>
          <span class="cta__label">打开未完成的展品</span>
          <span class="cta__go" aria-hidden="true">→</span>
        </button>

        <footer class="foot">
          <span class="dim">© <span id="year">2026</span> · 我们</span>
          <button class="foot__top glass glass--pill" id="topBtn" type="button">回到封面 ↑</button>
        </footer>
      </div>
    </section>
  </main>

  <!-- ── 音乐 ─────────────────────────────────────────────── -->
  <aside id="musicPlayer" aria-label="留声机音乐播放器"></aside>

  <script src="js/data.js"></script>
  <script src="js/food-data.js"></script>
  <script src="js/play-data.js"></script>
  <script src="js/time-data.js"></script>
  <script src="js/dates-data.js"></script>
  <script src="js/china-map.js"></script>
  <script src="js/glass.js"></script>
  <script src="js/main.js"></script>
  <script src="js/music.js"></script>
</body>
</html>
